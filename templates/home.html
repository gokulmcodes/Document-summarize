<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .loader {
      border: 6px solid #65a5e4;
      border-top: 6px solid #1abc9c;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .highlight-text {
      animation: textHighlight 3s infinite;
    }

    @keyframes textHighlight {
      0% { background-color: #e6fffa; }
      50% { background-color: #d1f7f0; }
      100% { background-color: #e6fffa; }
    }

    /* Override input text color for URL input on home page */
    #urlInput {
      color: #000000 !important; /* Force black text color */
    }

    /* Style for drag-and-drop area */
    #drop-area {
      border: 2px dashed #a0aec0;
      padding: 20px;
      text-align: center;
      background-color: #edf2f7;
      border-radius: 8px;
      transition: border-color 0.3s, background-color 0.3s;
    }

    #drop-area.highlight {
      border-color: #48bb78;
      background-color: #e6fffa;
    }

    #file-upload-btn {
      margin-top: 10px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <nav class="navbar">
    <a href="/home" class="brand">DocSummarizer</a>
    <button class="menu-toggle" id="menu-toggle">&#9776;</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="/home" class="active">Home</a></li>
      <li><a href="/features">Features</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/profile">Profile</a></li>
      <li><a href="/logout">Logout</a></li>
    </ul>
  </nav>

  <div class="container mx-auto p-6">
    <div class="bg-white rounded-xl shadow-2xl p-8 mb-6 transform transition duration-300 hover:scale-101">
      <h2 class="text-3xl font-semibold text-gray-800 mb-6">Advanced Document Summarizer</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Search Bar Section -->
        <div class="bg-gray-50 p-4 rounded-lg shadow-inner">
          <label for="urlInput" class="block text-sm font-medium text-gray-700">Enter URL to Summarize</label>
          <div class="mt-1 flex rounded-md shadow-sm">
            <input type="text" id="urlInput" class="flex-1 block w-full rounded-md border-gray-300 focus:border-teal-500 focus:ring-teal-500 sm:text-sm p-2" placeholder="Paste URL here...">
          </div>
        </div>

        <!-- File Upload Section -->
        <div class="bg-gray-50 p-4 rounded-lg shadow-inner">
          <label class="block text-sm font-medium text-gray-700">Upload File</label>
          <div id="drop-area" class="mt-1">
            <p class="text-gray-600">Drag & Drop your file here (PDF, DOC, DOCX)</p>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx" class="hidden">
          </div>
          <button id="file-upload-btn" class="mt-2 px-4 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 focus:outline-none">Choose File</button>
          <div id="fileInfo" class="text-sm text-gray-500 mt-2"></div>
        </div>
      </div>

      <button id="summarizeBtn" class="mt-6 w-full md:w-auto px-6 py-3 bg-teal-600 text-white rounded-md hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition duration-300">Summarize</button>

      <div class="language-controls mt-4 flex items-center space-x-2">
        <button id="translateToggle" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none">🌐 Translate</button>
        <select id="languageSelect" class="hidden px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="kn">Kannada</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="ur">Urdu</option>
        </select>
      </div>

      <div id="loader" class="loader hidden"></div>

      <div id="result" class="result-box mt-6 p-6 bg-gray-50 rounded-lg shadow-inner">
        <div id="summaryText" class="text-gray-800 leading-relaxed"></div>
        <button id="speakButton" class="mt-4 px-4 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 focus:outline-none">🔊 Speak</button>
        <audio id="audioPlayer" controls class="mt-2 w-full max-w-xs"></audio>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    document.getElementById('file-upload-btn').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileInfo').textContent = `Selected: ${file.name}`;
        document.getElementById('fileInfo').style.display = 'block';
        alert('File uploaded successfully!'); // Popup message
      }
    });

    const dropArea = document.getElementById('drop-area');
    dropArea.addEventListener('dragover', function(e) {
      e.preventDefault();
      dropArea.classList.add('highlight');
    });

    dropArea.addEventListener('dragleave', function(e) {
      e.preventDefault();
      dropArea.classList.remove('highlight');
    });

    dropArea.addEventListener('drop', function(e) {
      e.preventDefault();
      dropArea.classList.remove('highlight');
      const file = e.dataTransfer.files[0];
      if (file && (file.type === 'application/pdf' || file.name.endsWith('.doc') || file.name.endsWith('.docx'))) {
        const fileInput = document.getElementById('fileInput');
        fileInput.files = e.dataTransfer.files;
        document.getElementById('fileInfo').textContent = `Dropped: ${file.name}`;
        document.getElementById('fileInfo').style.display = 'block';
        alert('File uploaded successfully!'); // Popup message
      }
    });

    let summarizedText = '';

    document.getElementById('summarizeBtn').addEventListener('click', function() {
      const url = document.getElementById('urlInput').value.trim();
      const file = document.getElementById('fileInput').files[0];
      const formData = new FormData();

      if (url) {
        formData.append('url', url);
      } else if (file) {
        formData.append('file', file);
      } else {
        alert('Please provide a URL or upload a file.');
        return;
      }

      const loader = document.getElementById('loader');
      const result = document.getElementById('result');
      const summaryText = document.getElementById('summaryText');
      loader.classList.remove('hidden');
      result.classList.remove('hidden'); // Ensure result is visible

      fetch('/summarize', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        loader.classList.add('hidden');
        if (data.error) {
          summaryText.textContent = data.error;
        } else {
          summarizedText = data.summary; // Store the summarized text
          summaryText.innerHTML = summarizedText;
        }
      })
      .catch(error => {
        loader.classList.add('hidden');
        summaryText.textContent = 'Error processing request.';
      });
    });

    document.getElementById('translateToggle').addEventListener('click', function() {
      const select = document.getElementById('languageSelect');
      select.classList.toggle('hidden');
    });

    document.getElementById('languageSelect').addEventListener('change', function() {
      const lang = this.value;
      const summaryText = document.getElementById('summaryText');
      if (summarizedText && lang) {
        fetch('/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: summarizedText, lang: lang })
        })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            summaryText.textContent = data.error;
          } else {
            summaryText.innerHTML = data.translated;
          }
        })
        .catch(error => {
          summaryText.textContent = 'Translation failed.';
        });
      }
    });

    document.getElementById('speakButton').addEventListener('click', function() {
      const text = document.getElementById('summaryText').textContent;
      const lang = document.getElementById('languageSelect').value || 'en';
      if (text) {
        fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, lang: lang })
        })
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert(data.error);
          } else {
            document.getElementById('audioPlayer').src = data.audio_path;
            document.getElementById('audioPlayer').play();
          }
        })
        .catch(error => {
          alert('Error generating speech.');
        });
      }
    });

    // Toggle mobile menu
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('nav-links').classList.toggle('active');
    });
  </script>
</body>
</html>
