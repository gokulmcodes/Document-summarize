<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Summarizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    #drop-area {
      border: 2px dashed #e2e8f0;
      padding: 2rem;
      border-radius: 8px;
      background: #edf2f7;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #drop-area.highlight {
      border-color: #1abc9c;
      background: #e6fffa;
      transform: scale(1.02);
    }

    #drop-area p {
      margin: 0;
      font-size: 1.1rem;
      color: #2d3748;
    }

    #fileInput {
      display: none;
    }

    #uploadBtn, #summarizeBtn {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
    }

    #summarizeBtn {
      background-color: #3498db;
    }

    #summarizeBtn:hover {
      background-color: #2980b9;
    }

    .loader {
      display: none;
      margin: 2rem auto;
      width: 50px;
      height: 50px;
      border: 6px solid #edf2f7;
      border-top: 6px solid #1abc9c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-box {
      display: none;
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .file-info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #4a5568;
    }

    .result-box p {
      line-height: 1.6;
      color: #2d3748;
      position: relative;
    }

    .result-box ul {
      padding-left: 1.5rem;
    }

    .result-box li {
      margin-bottom: 0.5rem;
      color: #4a5568;
    }

    .language-controls {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .translate-toggle, #languageSelect {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      font-size: 0.9rem;
    }

    #languageSelect {
      display: none;
    }

    #audioPlayer {
      margin-top: 1rem;
      width: 100%;
      max-width: 300px;
    }

    /* Text Highlight Animation */
    .highlight-text {
      background-color: #e6fffa;
      animation: textHighlight 3s infinite;
    }

    @keyframes textHighlight {
      0% { background-color: #e6fffa; }
      50% { background-color: #d1f7f0; }
      100% { background-color: #e6fffa; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/home">Home</a>
    <a href="/features">Features</a>
    <a href="/about">About</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
  </nav>

  <div class="form-container">
    <h2>Document Summarizer</h2>
    <div id="drop-area">
      <p>Drag & Drop your file here or click to upload (PDF, DOC, DOCX)</p>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx" hidden>
      <button id="uploadBtn">Choose File</button>
    </div>
    <div id="fileInfo" class="file-info" style="display:none;"></div>
    <button id="summarizeBtn">Summarize</button>

    <div class="language-controls">
      <button class="translate-toggle" onclick="toggleLanguage()">🌐 Language</button>
      <select id="languageSelect">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
      </select>
    </div>

    <div class="loader" id="loader"></div>

    <div id="result" class="result-box">
      <p id="summaryText"></p>
      <button id="speakButton">🔊 Speak</button>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
